# Navigation Links
#   The homepage renders as a single scrolling page with no navbar
#   (see `header.navbar.enable` in params.yaml), so no `main` menu is defined.
#   Sub-pages link back to the homepage via `layouts/partials/site_header.html`.
#
#   To re-enable a navbar, set `header.navbar.enable: true` in params.yaml and
#   define a `main` menu here. Anchor links point at a homepage widget by
#   filename, e.g. `url: '#about'` for `content/home/about.md`.
